name: Build PULSAR Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 서브모듈을 여기서 미리 가져오면 빌드 속도가 더 빨라집니다.
          submodules: recursive 

      - name: Build in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: px4io/px4-dev-nuttx-bionic:2020-04-01
          # 호스트의 현재 폴더(${{ github.workspace }})를 컨테이너의 /src 폴더로 연결합니다.
          options: -v ${{ github.workspace }}:/src
          run: |
            # 1. 경로 이동 수정: /src/3-PX4_Firmware가 아니라 그냥 /src로 가야 합니다.
            cd /src
            
            # 2. 보안 및 경로 설정
            git config --global --add safe.directory /src
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            
            # 3. 서브모듈 업데이트 (이미 위에서 가져왔다면 생략 가능하지만 안전을 위해 유지)
            git submodule sync --recursive
            git submodule update --init --recursive --depth 1 --jobs 8
            
            # 4. 이전 빌드 기록 삭제 및 빌드 시작
            rm -rf build/
            make px4_fmu-v4_default

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar_firmware
          # 업로드 경로도 실제 빌드 결과물 위치에 맞게 수정했습니다.
          path: build/px4_fmu-v4_default/px4_fmu-v4_default.px4
