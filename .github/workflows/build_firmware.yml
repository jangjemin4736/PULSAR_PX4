name: Build PULSAR Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 최신 보안 기준 적용
        with:
          submodules: false # 여기서 가져오지 말고 밑에서 수동으로 제어
          fetch-depth: 1

      - name: Run build in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: px4io/px4-dev-nuttx-bionic:2020-04-01
          options: -v ${{ github.workspace }}:/work
          run: |
            cd /work
            # 1. 보안 관련 깃 설정 강제 적용
            git config --global --add safe.directory /work
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            
            # 2. 서브모듈 초기화 (에러 무시하고 진행하도록 설정)
            git submodule sync
            git submodule update --init --recursive --jobs 8 || echo "Some submodules failed, but continuing..."
            
            # 3. 빌드 시작
            make distclean
            make px4_fmu-v4_default

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar_pixhawk_firmware
          path: build/px4_fmu-v4_default/px4_fmu-v4_default.px4
