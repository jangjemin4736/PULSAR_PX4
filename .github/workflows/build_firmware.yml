name: Build PULSAR Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: px4io/px4-dev-nuttx-bionic:2020-04-01 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4로 업데이트
        with:
          submodules: recursive 

      - name: Set ownership
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Build Firmware
        run: |
          make distclean
          make px4_fmu-v4_default 

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # v4로 업데이트 (이게 핵심!)
        with:
          name: pulsar_pixhawk_firmware
          path: build/px4_fmu-v4_default/px4_fmu-v4_default.px4
