name: Build PULSAR Firmware
on: [push] # 코드를 수정해서 올릴 때마다 자동 빌드

jobs:
  build:
    runs-on: ubuntu-latest
    container: px4io/px4-dev-nuttx-focal:2022-08-12 # PULSAR가 쓰던 환경 그대로 사용
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive # PX4 핵심 라이브러리들 다 긁어오기

      - name: Build for Pixhawk 4 Mini
        run: |
          make px4_fmu-v4mini_default # PULSAR 팀이 쓰던 빌드 명령어 그대로 실행

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pulsar_firmware
          path: build/px4_fmu-v4mini_default/px4_fmu-v4mini_default.px4
