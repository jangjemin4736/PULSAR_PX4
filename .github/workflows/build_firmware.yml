name: Build PULSAR Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: px4io/px4-dev-nuttx-bionic:2020-04-01
          options: -v ${{ github.workspace }}:/src
          run: |
            cd /src/3-PX4_Firmware
            
            # 1. 서브모듈을 지우지 않고 업데이트만 진행
            git config --global --add safe.directory /src
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            
            # 2. 필요한 서브모듈만 빠르게 가져오기
            git submodule sync --recursive
            git submodule update --init --recursive --depth 1 --jobs 8
            
            # 3. [중요] distclean은 서브모듈을 지우므로 절대 금지! 
            # 대신 빌드 폴더만 지우는 clean 정도만 하거나 바로 빌드합니다.
            rm -rf build/
            
            # 4. 진짜 빌드 시작
            make px4_fmu-v4_default

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar_firmware
          path: 3-PX4_Firmware/build/px4_fmu-v4_default/px4_fmu-v4_default.px4
