name: Build PULSAR Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 서브모듈은 여기서 처리하지 않습니다.

      - name: Build in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: px4io/px4-dev-nuttx-bionic:2020-04-01
          options: -v ${{ github.workspace }}:/src
          run: |
            cd /src
            
            # 1. 낡은 인증서 강제 업데이트 (2026년 환경 대응)
            apt-get update && apt-get install -y ca-certificates
            update-ca-certificates
            
            # 2. 깃 보안 설정 완화 및 주소 변환
            git config --global --add safe.directory /src
            git config --global http.sslVerify false
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            
            # 3. 서브모듈 초기화 (에러가 나도 빌드는 시도하도록 설정)
            cd 3-PX4_Firmware
            git submodule sync --recursive
            git submodule update --init --recursive --depth 1 || echo "Warning: Some submodules failed, continuing anyway..."
            
            # 4. 진짜 빌드
            make distclean
            make px4_fmu-v4_default

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar_firmware
          path: 3-PX4_Firmware/build/px4_fmu-v4_default/px4_fmu-v4_default.px4
